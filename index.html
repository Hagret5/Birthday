<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&family=Dancing+Script:wght@700&family=Poppins:wght@600;900&family=Playfair+Display:ital,wght@1,700&family=Amiri:ital,wght@0,700;1,700&family=Reem+Kufi:wght@600&family=Cairo:wght@800&family=Bebas+Neue&family=Abril+Fatface&family=Caveat:wght@700&family=Space+Mono:wght@700&family=Righteous&family=Tajawal:wght@800&family=Rakkas&family=Lalezar&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class='moon'>
  <div class='crater1'></div>
  <div class='crater2'></div>
  <div class='crater3'></div>
</div>
<canvas id="canvas"></canvas>
<div id="sea"></div>
<div id="beach"></div>
<img src="https://dl.dropbox.com/s/2k0mtrxc2dqurmh/jumping.png" alt="jumping-people" id="people" />

<div id="merrywrap" class="merrywrap">
  <div class="giftbox">
    <div class="cover">
      <div></div>
    </div>
    <div class="box"></div>
  </div>
  <div class="icons">
    <div class="row">
      <span>H</span>
      <span>A</span>
      <span>P</span>
      <span>P</span>
      <span>Y</span>
    </div>
    <div class="row">
      <span>B</span>
      <span>I</span>
      <span>R</span>
      <span>T</span>
      <span>H</span>
      <span>D</span>
      <span>A</span>
      <span>Y</span>
    </div>
    <div class="row">
      <span>Z</span>
      <span>I</span>
      <span>N</span>
      <span>E</span>
      <span>B</span>
      <span>❤️</span>
    </div>
  </div>
</div>

<!-- Name animation (replaces the YouTube video) -->
<div id="video"></div>
<!-- Centered dialogue and ending heart -->
<div id="birthday-dialogue" aria-live="polite">
  <div class="dialogue-burst" id="dialogueBurst"></div>

  <div class="dialogue-heart" id="dialogueHeart">
    <svg
      viewBox="0 0 32 29.6"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <defs>
        <radialGradient id="dialogueHeartGradient" cx="50%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#ff8fc8"/>
          <stop offset="55%" stop-color="#ff1493"/>
          <stop offset="100%" stop-color="#c2005f"/>
        </radialGradient>
      </defs>

      <path
        fill="url(#dialogueHeartGradient)"
        d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"
      />
    </svg>
  </div>

  <div class="dialogue-text-area">
    <div id="dialogueMessage"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
